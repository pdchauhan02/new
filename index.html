<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ગુજરાતી વસ્તુ સ્ટોક મેનેજમેન્ટ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="topnav" aria-label="મુખ્ય મેનૂ">
    <div class="topnav-inner">
      <a class="brand" href="index.html">સ્ટોક મેનેજમેન્ટ</a>
      <div class="nav-links">
        <a href="index.html" aria-current="page">વસ્તુઓ</a>
        <a href="categories.html">કેટેગરી</a>
        <a href="companies.html">કંપનીઓ</a>
      </div>
    </div>
  </nav>

  <main class="container">

    <header>
      <div>
        <h1>વસ્તુ સ્ટોક મેનેજમેન્ટ</h1>
        <p class="subtitle">
          કંપની, વસ્તુ, વજન / નંગ અને નેટ ભાવની માહિતી
        </p>
      </div>
    </header>

    <!-- Product list -->
    <section class="panel">
      <div class="panel-head">
        <h2>વસ્તુઓની યાદી</h2>
        <button type="button" class="btn-primary" id="addButton">
          + વસ્તુ ઉમેરો
        </button>
      </div>

      <div class="toolbar">
        <input
          id="searchInput"
          type="search"
          placeholder="કંપની અથવા વસ્તુનું નામ શોધો..."
          aria-label="વસ્તુ શોધો"
        >

        <select id="companyFilter" aria-label="કંપની પ્રમાણે ફિલ્ટર">
          <option value="">બધી કંપનીઓ</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table class="wide">
          <thead>
            <tr>
              <th>ક્રમ</th>
              <th>કંપનીનું નામ</th>
              <th>વસ્તુનું નામ</th>
              <th>નેટ ભાવ (₹)</th>
              <th>ક્રિયા</th>
            </tr>
          </thead>

          <tbody id="productTable">
            <tr>
              <td colspan="5" class="empty">લોડ થઈ રહ્યું છે...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="listMessage" class="message" role="status"
           aria-live="polite"></div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" id="resetDemo">
          ડેમો ડેટા ફરીથી લાવો
        </button>
      </div>
    </section>

    <div class="footer">
      આ ડેટા તમારા વર્તમાન બ્રાઉઝરમાં સેવ થાય છે.
    </div>
  </main>

  <!-- Add / Edit modal -->
  <dialog id="productModal" aria-labelledby="formTitle">
    <div class="modal-head">
      <h2 id="formTitle">નવી વસ્તુ ઉમેરો</h2>
      <button
        type="button"
        class="icon-btn btn-close"
        id="closeModal"
        aria-label="બંધ કરો"
        title="બંધ કરો"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form id="productForm" class="modal-body">
      <div class="form-grid">

        <div>
          <label for="company">કંપનીનું નામ *</label>
          <input
            id="company"
            type="text"
            maxlength="150"
            placeholder="દા.ત. પટેલ ટ્રેડર્સ"
            required
          >
        </div>

        <div>
          <label for="productName">વસ્તુનું નામ *</label>
          <input
            id="productName"
            type="text"
            maxlength="150"
            placeholder="દા.ત. ઘઉં"
            required
          >
        </div>

        <div>
          <label for="netPrice">નેટ ભાવ (₹) *</label>
          <input
            id="netPrice"
            type="number"
            min="0"
            step="0.01"
            placeholder="1200"
            required
          >
        </div>

      </div>

      <div id="message" class="message error" role="alert"></div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" id="cancelButton">
          રદ કરો
        </button>

        <button type="submit" class="btn-primary" id="saveButton">
          + વસ્તુ ઉમેરો
        </button>
      </div>
    </form>
  </dialog>

  <script src="store.js"></script>
  <script>
    "use strict";

    let products = [];
    let categories = [];
    let editingId = null;

    function showFormError(message) {
      $("message").textContent = message;
    }

    function getUniqueCompanies() {
      const companySet = new Set();
      products.forEach(product => companySet.add(product.company));
      return Array.from(companySet).sort((a, b) => a.localeCompare(b, "gu"));
    }

    function renderCompanyFilter() {
      const filter = $("companyFilter");
      const current = filter.value;

      filter.replaceChildren(new Option("બધી કંપનીઓ", ""));
      getUniqueCompanies().forEach(company => {
        filter.add(new Option(company, company));
      });
      filter.value = getUniqueCompanies().includes(current) ? current : "";
    }

    function renderProducts() {
      const tbody = $("productTable");
      const search = $("searchInput").value.trim().toLocaleLowerCase();
      const companyFilter = $("companyFilter").value;

      const filtered = products.filter(product => {
        const matchesSearch =
          product.name.toLocaleLowerCase().includes(search) ||
          product.company.toLocaleLowerCase().includes(search);

        const matchesCompany =
          !companyFilter || product.company === companyFilter;

        return matchesSearch && matchesCompany;
      });

      tbody.replaceChildren();

      if (filtered.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 5;
        cell.className = "empty";
        cell.textContent = "કોઈ વસ્તુ મળી નથી.";

        row.appendChild(cell);
        tbody.appendChild(row);
      }

      const columnLabels = [
        "ક્રમ",
        "કંપનીનું નામ",
        "વસ્તુનું નામ",
        "નેટ ભાવ (₹)",
        "ક્રિયા"
      ];

      filtered.forEach((product, index) => {
        const row = document.createElement("tr");

        const values = [
          index + 1,
          product.company,
          product.name,
          formatCurrency(product.netPrice)
        ];

        values.forEach((value, valueIndex) => {
          const cell = document.createElement("td");

          cell.dataset.label = columnLabels[valueIndex];
          // textContent prevents user-entered HTML from being executed.
          cell.textContent = String(value);
          row.appendChild(cell);
        });

        const actionCell = document.createElement("td");
        actionCell.dataset.label = columnLabels[4];

        const actions = document.createElement("div");
        actions.className = "actions";

        actions.append(
          createIconButton("btn-edit", EDIT_ICON, "એડિટ", () => {
            editProduct(product.id);
          }),
          createIconButton("btn-delete", DELETE_ICON, "ડિલીટ", () => {
            deleteProduct(product.id);
          })
        );

        actionCell.appendChild(actions);
        row.appendChild(actionCell);
        tbody.appendChild(row);
      });
    }

    function resetForm() {
      editingId = null;
      $("productForm").reset();
      showFormError("");

      $("formTitle").textContent = "નવી વસ્તુ ઉમેરો";
      $("saveButton").textContent = "+ વસ્તુ ઉમેરો";
    }

    function openModal() {
      $("productModal").showModal();
      $("company").focus();
    }

    $("addButton").addEventListener("click", () => {
      resetForm();
      openModal();
    });



    $("productForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const company = $("company").value.trim();
      const name = $("productName").value.trim();
      const netPrice = Number($("netPrice").value);

      if (
        !company ||
        !name ||
        $("netPrice").value.trim() === "" ||
        !Number.isFinite(netPrice) ||
        netPrice < 0
      ) {
        showFormError("કૃપા કરીને બધી માહિતી યોગ્ય રીતે ભરો.");
        return;
      }

      const fields = { company, name, netPrice };
      let nextProducts;

      if (editingId !== null) {
        nextProducts = products.map(product =>
          product.id === editingId ? { ...product, ...fields } : product
        );
      } else {
        nextProducts = [...products, { id: nextId(products), ...fields }];
      }

      // Only update the current state after the save succeeds.
      if (!saveList(PRODUCTS_KEY, nextProducts)) {
        showFormError(SAVE_ERROR);
        return;
      }

      products = nextProducts;

      const message = editingId !== null
        ? "વસ્તુની માહિતી અપડેટ થઈ ગઈ છે."
        : "નવી વસ્તુ સફળતાપૂર્વક ઉમેરાઈ છે.";

      $("productModal").close();
      renderCompanyFilter();
      renderProducts();
      showMessage("listMessage", message);
    });

    function editProduct(id) {
      const product = products.find(item => item.id === id);

      if (!product) return;

      resetForm();
      editingId = id;

      $("company").value = product.company;
      $("productName").value = product.name;
      $("netPrice").value = product.netPrice;

      $("formTitle").textContent = "વસ્તુની માહિતી એડિટ કરો";
      $("saveButton").textContent = "માહિતી અપડેટ કરો";

      openModal();
    }

    function deleteProduct(id) {
      const product = products.find(item => item.id === id);

      if (!product) return;

      const confirmed = confirm(
        `"${product.name}" વસ્તુ ડિલીટ કરવી છે?`
      );

      if (!confirmed) return;

      const nextProducts = products.filter(item => item.id !== id);

      if (!saveList(PRODUCTS_KEY, nextProducts)) {
        showMessage("listMessage", SAVE_ERROR, true);
        return;
      }

      products = nextProducts;
      renderCompanyFilter();
      renderProducts();
      showMessage("listMessage", "વસ્તુ સફળતાપૂર્વક ડિલીટ થઈ ગઈ છે.");
    }

    setupModal(
      $("productModal"),
      [$("cancelButton"), $("closeModal")],
      resetForm
    );

    $("searchInput").addEventListener("input", renderProducts);

    $("companyFilter").addEventListener("change", renderProducts);

    $("resetDemo").addEventListener("click", () => {
      const confirmed = confirm(
        "હાલનો બધો ડેટા (વસ્તુઓ અને કેટેગરી) બદલીને ડેમો ડેટા લાવવો છે?"
      );

      if (!confirmed) return;

      const nextProducts = cloneList(demoProducts);
      const nextCategories = cloneList(demoCategories);

      const saved = saveLists([
        { key: PRODUCTS_KEY, value: nextProducts, previous: products },
        { key: CATEGORIES_KEY, value: nextCategories, previous: categories }
      ]);

      if (!saved) {
        showMessage("listMessage", SAVE_ERROR, true);
        return;
      }

      products = nextProducts;
      categories = nextCategories;

      renderCompanyFilter();
      renderProducts();
      showMessage("listMessage", "ડેમો ડેટા ફરીથી લોડ થઈ ગયો છે.");
    });

    // Initialize the page.
    const data = loadData();
    products = data.products;
    categories = data.categories;

    if (!data.ok) {
      showMessage(
        "listMessage",
        "સેવ કરેલો ડેટા વાંચી શકાયો નથી. ડેમો ડેટા ફરી લાવવા બટન વાપરો.",
        true
      );
    }

    renderCompanyFilter();
    renderProducts();
  </script>
</body>
</html>
