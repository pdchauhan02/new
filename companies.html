<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>કંપની પ્રમાણે વસ્તુઓ — સ્ટોક મેનેજમેન્ટ</title>
  <meta name="description" content="કંપની પ્રમાણે વસ્તુઓ જુઓ, ફિલ્ટર કરો અને નવી વસ્તુ ઉમેરો">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="companies.css">
</head>

<body>
  <nav class="topnav" aria-label="મુખ્ય મેનૂ">
    <div class="topnav-inner">
      <a class="brand" href="index.html">સ્ટોક મેનેજમેન્ટ</a>
      <div class="nav-links">
        <a href="index.html">વસ્તુઓ</a>
        <a href="categories.html">કેટેગરી</a>
        <a href="companies.html" aria-current="page">કંપનીઓ</a>
      </div>
    </div>
  </nav>

  <main class="container">

    <header>
      <div>
        <h1>કંપની પ્રમાણે વસ્તુઓ</h1>
        <p class="subtitle">
          કંપની પસંદ કરો અને તેની બધી વસ્તુઓ જુઓ / ઉમેરો
        </p>
      </div>
    </header>

    <!-- Search bar -->
    <section class="panel search-panel">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input
          id="companySearch"
          type="search"
          placeholder="કંપનીનું નામ શોધો..."
          aria-label="કંપની શોધો"
        >
      </div>
      <div class="search-stats" id="searchStats"></div>
    </section>

    <!-- Company cards grid -->
    <div class="company-grid" id="companyGrid">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" aria-hidden="true">
          <path d="M3 21h18"/>
          <path d="M5 21V7l8-4v18"/>
          <path d="M19 21V11l-6-4"/>
          <path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/>
        </svg>
        <p>લોડ થઈ રહ્યું છે...</p>
      </div>
    </div>

    <!-- Company detail panel (hidden by default) -->
    <section class="panel company-detail" id="companyDetail" hidden>
      <div class="detail-header">
        <button type="button" class="btn-back" id="backButton" aria-label="પાછા જાઓ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          પાછા જાઓ
        </button>
        <div class="detail-title-row">
          <div class="company-avatar-lg" id="detailAvatar"></div>
          <div>
            <h2 id="detailCompanyName">—</h2>
            <p class="detail-meta" id="detailMeta"></p>
          </div>
        </div>
        <button type="button" class="btn-primary" id="addProductForCompany">
          + વસ્તુ ઉમેરો
        </button>
      </div>

      <div class="table-wrapper">
        <table class="wide">
          <thead>
            <tr>
              <th>ક્રમ</th>
              <th>વસ્તુનું નામ</th>
              <th>કેટેગરી</th>
              <th>જથ્થો (વજન / નંગ)</th>
              <th>નેટ ભાવ (₹)</th>
              <th>ક્રિયા</th>
            </tr>
          </thead>

          <tbody id="companyProductTable">
            <tr>
              <td colspan="6" class="empty">કોઈ વસ્તુ નથી.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="detailMessage" class="message" role="status"
           aria-live="polite"></div>
    </section>

    <div class="footer">
      આ ડેટા તમારા વર્તમાન બ્રાઉઝરમાં સેવ થાય છે.
    </div>
  </main>

  <!-- Add / Edit product modal -->
  <dialog id="productModal" aria-labelledby="formTitle">
    <div class="modal-head">
      <h2 id="formTitle">નવી વસ્તુ ઉમેરો</h2>
      <button
        type="button"
        class="icon-btn btn-close"
        id="closeModal"
        aria-label="બંધ કરો"
        title="બંધ કરો"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form id="productForm" class="modal-body">
      <div class="form-grid">

        <div>
          <label for="company">કંપનીનું નામ *</label>
          <input
            id="company"
            type="text"
            maxlength="150"
            placeholder="દા.ત. પટેલ ટ્રેડર્સ"
            required
          >
        </div>

        <div>
          <label for="productName">વસ્તુનું નામ *</label>
          <input
            id="productName"
            type="text"
            maxlength="150"
            placeholder="દા.ત. ઘઉં"
            required
          >
        </div>

        <div>
          <div class="label-row">
            <label for="category">કેટેગરી *</label>
            <a class="field-link" href="categories.html">+ નવી કેટેગરી</a>
          </div>
          <select id="category" required></select>
        </div>

        <fieldset class="unit-toggle">
          <legend>એકમ *</legend>
          <div class="unit-options">
            <label>
              <input type="radio" name="unit" value="kg" checked>
              <span>વજન (કિગ્રા.)</span>
            </label>
            <label>
              <input type="radio" name="unit" value="piece">
              <span>નંગ</span>
            </label>
          </div>
        </fieldset>

        <div>
          <label for="quantity" id="quantityLabel">જથ્થો (કિગ્રા.) *</label>
          <input
            id="quantity"
            type="number"
            min="0"
            step="0.001"
            placeholder="25"
            required
          >
        </div>

        <div>
          <label for="netPrice">નેટ ભાવ (₹) *</label>
          <input
            id="netPrice"
            type="number"
            min="0"
            step="0.01"
            placeholder="1200"
            required
          >
        </div>

      </div>

      <div id="message" class="message error" role="alert"></div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" id="cancelButton">
          રદ કરો
        </button>

        <button type="submit" class="btn-primary" id="saveButton">
          + વસ્તુ ઉમેરો
        </button>
      </div>
    </form>
  </dialog>

  <script src="store.js"></script>
  <script>
    "use strict";

    let products = [];
    let categories = [];
    let editingId = null;
    let activeCompany = null; // currently selected company name

    /* ─── helpers ────────────────────────────────────── */

    function showFormError(message) {
      $("message").textContent = message;
    }

    function categoryUnit(name) {
      const category = categories.find(item => item.name === name);
      return category ? category.unit : "kg";
    }

    function setUnit(unit) {
      const value = UNITS[unit] ? unit : "kg";
      $("productForm").elements.unit.value = value;
      $("quantityLabel").textContent = `જથ્થો (${UNITS[value].short}) *`;
      $("quantity").step = UNITS[value].step;
    }

    function renderCategoryOptions() {
      const select = $("category");
      select.replaceChildren();
      categories.forEach(category => {
        select.add(new Option(category.name, category.name));
      });
    }

    function getInitials(name) {
      return name
        .split(/\s+/)
        .slice(0, 2)
        .map(w => w.charAt(0))
        .join("")
        .toUpperCase();
    }

    // Deterministic color from company name.
    function avatarHue(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return Math.abs(hash) % 360;
    }

    /* ─── build unique company list ─────────────────── */

    function buildCompanyData() {
      const map = new Map();

      products.forEach(product => {
        const key = product.company;
        if (!map.has(key)) {
          map.set(key, {
            name: key,
            count: 0,
            totalValue: 0,
            categories: new Set()
          });
        }
        const entry = map.get(key);
        entry.count++;
        entry.totalValue += product.netPrice;
        entry.categories.add(product.category);
      });

      return Array.from(map.values()).sort((a, b) =>
        a.name.localeCompare(b.name, "gu")
      );
    }

    /* ─── company card grid ──────────────────────────── */

    function renderCompanyGrid() {
      const grid = $("companyGrid");
      const search = $("companySearch").value.trim().toLocaleLowerCase();
      const allCompanies = buildCompanyData();

      const filtered = search
        ? allCompanies.filter(c => c.name.toLocaleLowerCase().includes(search))
        : allCompanies;

      grid.replaceChildren();

      // Stats
      $("searchStats").textContent = search
        ? `${filtered.length} / ${allCompanies.length} કંપનીઓ`
        : `કુલ ${allCompanies.length} કંપનીઓ`;

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <p>${search ? "\"" + search + "\" માટે કોઈ કંપની મળી નથી." : "કોઈ કંપની નથી. પહેલાં વસ્તુ ઉમેરો."}</p>
        `;
        grid.appendChild(empty);
        return;
      }

      filtered.forEach(company => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "company-card";
        card.setAttribute("aria-label", `${company.name} — ${company.count} વસ્તુઓ`);

        const hue = avatarHue(company.name);

        card.innerHTML = `
          <div class="card-avatar" style="--hue:${hue}">
            ${getInitials(company.name)}
          </div>
          <div class="card-body">
            <h3 class="card-title">${escapeHTML(company.name)}</h3>
            <div class="card-chips">
              <span class="chip chip-count">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" aria-hidden="true">
                  <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                </svg>
                ${company.count} વસ્તુ
              </span>
              <span class="chip chip-value">
                ${formatCurrency(company.totalValue)}
              </span>
            </div>
          </div>
          <svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        `;

        card.addEventListener("click", () => openCompanyDetail(company.name));
        grid.appendChild(card);
      });
    }

    function escapeHTML(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    /* ─── company detail view ────────────────────────── */

    function openCompanyDetail(companyName) {
      activeCompany = companyName;

      // Hide grid, show detail
      $("companyGrid").parentElement.querySelector(".search-panel").hidden = true;
      $("companyGrid").hidden = true;
      $("companyDetail").hidden = false;

      // Fill header
      const hue = avatarHue(companyName);
      $("detailAvatar").textContent = getInitials(companyName);
      $("detailAvatar").style.setProperty("--hue", hue);
      $("detailCompanyName").textContent = companyName;

      renderCompanyProducts();

      // Scroll to top
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeCompanyDetail() {
      activeCompany = null;
      $("companyDetail").hidden = true;
      $("companyGrid").hidden = false;
      $("companyGrid").parentElement.querySelector(".search-panel").hidden = false;

      renderCompanyGrid();
    }

    function renderCompanyProducts() {
      const companyProducts = products.filter(
        product => product.company === activeCompany
      );

      const totalValue = companyProducts.reduce((sum, p) => sum + p.netPrice, 0);
      $("detailMeta").textContent =
        `${companyProducts.length} વસ્તુઓ · કુલ ${formatCurrency(totalValue)}`;

      const tbody = $("companyProductTable");
      tbody.replaceChildren();

      if (companyProducts.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 6;
        cell.className = "empty";
        cell.textContent = "આ કંપનીની કોઈ વસ્તુ નથી.";
        row.appendChild(cell);
        tbody.appendChild(row);
        return;
      }

      const columnLabels = [
        "ક્રમ",
        "વસ્તુનું નામ",
        "કેટેગરી",
        "જથ્થો",
        "નેટ ભાવ (₹)",
        "ક્રિયા"
      ];

      companyProducts.forEach((product, index) => {
        const row = document.createElement("tr");

        const values = [
          index + 1,
          product.name,
          product.category,
          formatQuantity(product),
          formatCurrency(product.netPrice)
        ];

        values.forEach((value, valueIndex) => {
          const cell = document.createElement("td");
          cell.dataset.label = columnLabels[valueIndex];
          cell.textContent = String(value);
          row.appendChild(cell);
        });

        const actionCell = document.createElement("td");
        actionCell.dataset.label = columnLabels[5];

        const actions = document.createElement("div");
        actions.className = "actions";

        actions.append(
          createIconButton("btn-edit", EDIT_ICON, "એડિટ", () => {
            editProduct(product.id);
          }),
          createIconButton("btn-delete", DELETE_ICON, "ડિલીટ", () => {
            deleteProduct(product.id);
          })
        );

        actionCell.appendChild(actions);
        row.appendChild(actionCell);
        tbody.appendChild(row);
      });
    }

    /* ─── modal / form logic ─────────────────────────── */

    function resetForm() {
      editingId = null;
      $("productForm").reset();
      showFormError("");

      $("formTitle").textContent = "નવી વસ્તુ ઉમેરો";
      $("saveButton").textContent = "+ વસ્તુ ઉમેરો";
      $("company").readOnly = false;

      setUnit(categoryUnit($("category").value));
    }

    function openModal() {
      $("productModal").showModal();
      $("company").focus();

      if (categories.length === 0) {
        showFormError("પહેલાં કેટેગરી ઉમેરો (ઉપર \"+ નવી કેટેગરી\" લિંક).");
      }
    }

    // "Add product for this company" button
    $("addProductForCompany").addEventListener("click", () => {
      resetForm();
      if (activeCompany) {
        $("company").value = activeCompany;
        $("company").readOnly = true;
      }
      openModal();
      $("productName").focus();
    });

    $("category").addEventListener("change", () => {
      setUnit(categoryUnit($("category").value));
    });

    $("productForm").addEventListener("change", (event) => {
      if (event.target.name === "unit") setUnit(event.target.value);
    });

    $("productForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const company = $("company").value.trim();
      const name = $("productName").value.trim();
      const category = $("category").value;
      const unit = $("productForm").elements.unit.value;
      const quantity = Number($("quantity").value);
      const netPrice = Number($("netPrice").value);

      if (!category) {
        showFormError("કૃપા કરીને કેટેગરી પસંદ કરો.");
        return;
      }

      if (
        !company ||
        !name ||
        !UNITS[unit] ||
        $("quantity").value.trim() === "" ||
        $("netPrice").value.trim() === "" ||
        !Number.isFinite(quantity) ||
        !Number.isFinite(netPrice) ||
        quantity < 0 ||
        netPrice < 0
      ) {
        showFormError("કૃપા કરીને બધી માહિતી યોગ્ય રીતે ભરો.");
        return;
      }

      if (unit === "piece" && !Number.isInteger(quantity)) {
        showFormError("નંગ પૂર્ણ સંખ્યામાં લખો (દા.ત. 10).");
        return;
      }

      const fields = { company, name, category, unit, quantity, netPrice };
      let nextProducts;

      if (editingId !== null) {
        nextProducts = products.map(product =>
          product.id === editingId ? { ...product, ...fields } : product
        );
      } else {
        nextProducts = [...products, { id: nextId(products), ...fields }];
      }

      if (!saveList(PRODUCTS_KEY, nextProducts)) {
        showFormError(SAVE_ERROR);
        return;
      }

      products = nextProducts;

      const msg = editingId !== null
        ? "વસ્તુની માહિતી અપડેટ થઈ ગઈ છે."
        : "નવી વસ્તુ સફળતાપૂર્વક ઉમેરાઈ છે.";

      $("productModal").close();

      // If we're in detail view, refresh it; otherwise refresh grid
      if (activeCompany) {
        // If the company name changed, switch to the new company
        if (activeCompany !== company) {
          activeCompany = company;
          openCompanyDetail(company);
        } else {
          renderCompanyProducts();
        }
        showMessage("detailMessage", msg);
      } else {
        renderCompanyGrid();
      }
    });

    function editProduct(id) {
      const product = products.find(item => item.id === id);
      if (!product) return;

      resetForm();
      editingId = id;

      $("company").value = product.company;
      $("productName").value = product.name;
      $("category").value = product.category;
      setUnit(product.unit);
      $("quantity").value = product.quantity;
      $("netPrice").value = product.netPrice;

      $("formTitle").textContent = "વસ્તુની માહિતી એડિટ કરો";
      $("saveButton").textContent = "માહિતી અપડેટ કરો";

      openModal();
    }

    function deleteProduct(id) {
      const product = products.find(item => item.id === id);
      if (!product) return;

      const confirmed = confirm(
        `"${product.name}" વસ્તુ ડિલીટ કરવી છે?`
      );
      if (!confirmed) return;

      const nextProducts = products.filter(item => item.id !== id);

      if (!saveList(PRODUCTS_KEY, nextProducts)) {
        showMessage("detailMessage", SAVE_ERROR, true);
        return;
      }

      products = nextProducts;

      if (activeCompany) {
        renderCompanyProducts();
        showMessage("detailMessage", "વસ્તુ સફળતાપૂર્વક ડિલીટ થઈ ગઈ છે.");
      } else {
        renderCompanyGrid();
      }
    }

    /* ─── event bindings ─────────────────────────────── */

    $("backButton").addEventListener("click", closeCompanyDetail);

    setupModal(
      $("productModal"),
      [$("cancelButton"), $("closeModal")],
      resetForm
    );

    $("companySearch").addEventListener("input", renderCompanyGrid);

    /* ─── initialize ─────────────────────────────────── */

    const data = loadData();
    products = data.products;
    categories = data.categories;

    if (!data.ok) {
      $("searchStats").textContent =
        "સેવ કરેલો ડેટા વાંચી શકાયો નથી.";
    }

    renderCategoryOptions();
    renderCompanyGrid();
  </script>
</body>
</html>
